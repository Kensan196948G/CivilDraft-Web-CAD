name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  # Issue #17: stacked PR（base≠main）でもCIが起動するよう、全ブランチ宛PRを対象にする
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run migrations:check

      - run: npm test

      - run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run secret:scan

  # Issue #12: SBOM（CycloneDX）をビルド成果物として生成・保存する
  compliance:
    name: SBOM / Notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - run: npm run sbom

      - run: git diff --exit-code sbom/civildraft-sbom.cdx.json

      - run: npm run notices

      - run: git diff --exit-code THIRD-PARTY-NOTICES.md

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/civildraft-sbom.cdx.json
          retention-days: 90
