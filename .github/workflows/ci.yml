name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  # Issue #17: stacked PR（base≠main）でもCIが起動するよう、全ブランチ宛PRを対象にする
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run migrations:check

      - name: Validate workflow YAML
        run: python3 scripts/validate-workflows.py

      - run: npm test

      - name: Coverage thresholds
        run: npm run test:coverage

      - run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      # 本番ビルド固有の描画問題（Konvaノード登録等）を検出する追加E2E
      - run: npx playwright test -c playwright.prod.config.ts

      - name: Performance thresholds (browser)
        run: node scripts/check-perf-thresholds.mjs --require tests/performance/results/browser-metrics.json --require tests/performance/results/browser-metrics-large.json --require tests/performance/results/browser-metrics-dxf.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-perf-metrics
          path: tests/performance/results/
          if-no-files-found: warn
          retention-days: 90

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - run: npm run perf

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-metrics
          path: tests/performance/results/perf-metrics.json
          if-no-files-found: error
          retention-days: 90

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run secret:scan

  # Issue #12: SBOM（CycloneDX）をビルド成果物として生成・保存する
  compliance:
    name: SBOM / Notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: npm

      # npm CLI自体のバージョンが変わるとscope判定等の出力が変わり偽陽性のドリフト検出になるため、
      # コミット済みSBOM（sbom/civildraft-sbom.cdx.json）を生成した時点のバージョンに固定する。
      - run: npm install -g npm@11.6.2

      - run: npm ci

      - run: npm run sbom

      - run: git diff --exit-code sbom/civildraft-sbom.cdx.json

      - run: npm run notices

      - run: git diff --exit-code THIRD-PARTY-NOTICES.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom/civildraft-sbom.cdx.json
          retention-days: 90
