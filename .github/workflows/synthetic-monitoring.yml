name: Production Health Check

# 2026-08-02: push 誤トリガーの根本原因は on キーのクォートではなく、
# --body の複数行文字列のインデント崩れによる YAML 構文エラーでした。
# クォートは YAML 1.1 パーサー対策として GitHub 公式推奨の記法を維持する。
"on":
  schedule:
    # 30 分毎（GitHub Actions の cron は遅延がありうるため、監視の補助として位置づける）
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Synthetic smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - name: Run health check
        run: node scripts/health-check.mjs

      - name: Create alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --search "本番ヘルスチェック失敗" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "既存のアラートIssueがあります（#$EXISTING）。重複作成をスキップします。"
          else
            gh issue create \
              --title "🚨 本番ヘルスチェック失敗（$(date -u +%Y-%m-%dT%H:%MZ)）" \
              --body "civildraft-web-cad.mirai-dx-platform.com の合成監視（SLO草案）が失敗しました。

          確認手順:
          1. この実行の health-summary.json（Artifacts）と Workflow ログを確認
          2. docs/operations/incident-response.md に従い一次対応（SPA/API/ヘッダー/デプロイ状態）
          3. 復旧確認後、本 Issue をクローズ

          対象: https://civildraft-web-cad.mirai-dx-platform.com"
          fi

      # 通知先は人間が決定するため、シークレットが設定された場合のみ Slack へ通知する。
      - name: Notify Slack on failure
        if: failure() && env.MONITOR_SLACK_WEBHOOK != ''
        env:
          MONITOR_SLACK_WEBHOOK: ${{ secrets.MONITOR_SLACK_WEBHOOK }}
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"🚨 CivilDraft 本番ヘルスチェック失敗: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$MONITOR_SLACK_WEBHOOK"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: health-summary
          path: health-summary.json
          retention-days: 30
