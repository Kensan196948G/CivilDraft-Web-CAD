name: Neon Backup

on:
  schedule:
    # 毎週日曜 00:30 JST（土曜 15:30 UTC）
    - cron: '30 15 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backup:
    name: Create Neon backup branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - name: Create backup branch
        run: node scripts/neon-backup.mjs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neon-backup-summary
          path: backup-summary.json
          retention-days: 90

  restore-check:
    name: Verify latest backup branch (restore drill)
    needs: backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - name: Run restore check
        run: node scripts/neon-restore-check.mjs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: neon-restore-check-summary
          path: restore-check-summary.json
          retention-days: 90
